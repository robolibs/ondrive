[package]
name = "ondrive"
version = "0.0.3"
edition = "2024"
description = "Rust motion-control / path-tracking library for mobile robots (PID, pure pursuit, Stanley, LQR, MPC, MPPI, ...)"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "include/**/*.h",
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]
python-extension = ["python"]

[dependencies]
datapod = { git = "https://github.com/robolibs/datapod", tag = "0.4.0" }
stateup = { git = "https://github.com/robolibs/stateup" }
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"
pyo3 = { version = "0.23", optional = true, features = [
    "abi3-py39",
    "extension-module",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
rerun = { version = "0.31.2", default-features = false, features = ["sdk", "server"] }
approx = "0.5"

[[bench]]
name = "tick"
harness = false

[[example]]
name = "apf"
path = "examples/rust/apf.rs"

